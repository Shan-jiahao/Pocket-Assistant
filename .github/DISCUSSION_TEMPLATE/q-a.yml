title: ""
body:
  - type: markdown
    attributes:
      value: |
        Ask away! Before posting, please check existing Q&A discussions to see if
        your Pocket Assistant question has already been answered.

        Found a bug? Open a GitHub Issue instead of a discussion.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you want to know? Be as specific as possible.
      placeholder: "How do I connect to my Osmo Pocket 4 over Wi-Fi?"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Head tracking
        - Gimbal control
        - Capture control
        - Camera control
        - Connection / pairing
        - Build / development
        - Other
    validations:
      required: true
